<style>
/* Layout : console de gestion sobre — rail de navigation à 5 entrées, barre « prochaine étape », écran central. Une seule couleur d'accent (orange ivoirien adouci), surfaces neutres légèrement bleutées, aucun halo. */
:root{
  --bg:#0A2418; --panel:#0F2E20; --panel2:#143727; --raise:#1A4130; --line:#1C3B2C; --line2:#29513E;
  --text:#F8F1E1; --muted:#A9B2A1; --dim:#6E7F70;
  --accent:#F15A1A; --accent-hi:#FF7A3D; --accent-ink:#1a0d05; --accent-soft:rgba(241,90,26,.14);
  --good:#8fb56a; --good-soft:rgba(143,181,106,.14); --bad:#d4654a; --bad-soft:rgba(212,101,74,.14);
  --warn:#e2b15a; --warn-soft:rgba(226,177,90,.14); --info:#9cc3b4; --info-soft:rgba(156,195,180,.12); --gold:#e2b15a;
  --grass1:#2f6a3a; --grass2:#275c32; --chalk:#F8F1E1;
  --f-disp:Fraunces,Georgia,serif;
  --f-body:Outfit,"Segoe UI",system-ui,sans-serif;
  --f-num:Outfit,"Segoe UI",system-ui,sans-serif;
  --r:14px; --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.18);
  color-scheme:dark;
  --tz:1;
  --topbg:rgba(10,36,24,.92); --tabbg:rgba(15,46,32,.94);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:calc(16px*var(--tz));line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--f-disp);font-weight:680;letter-spacing:-.025em}h3,h4{font-family:var(--f-body);font-weight:650;letter-spacing:-.02em}h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.15}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.good{color:var(--good)} .bad{color:var(--bad)} .goldt{color:var(--gold)}
.lbl{font-size:calc(12.5px*var(--tz));font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kita{height:3px;background:linear-gradient(90deg,var(--accent) 0 33.3%,var(--chalk) 33.3% 66.6%,var(--good) 66.6%);opacity:.9}
/* --- shell --- */
#app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 14px;display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-disp);font-size:calc(26px*var(--tz));font-weight:800;letter-spacing:.02em;line-height:.95}
.brand span{font-size:calc(12.5px*var(--tz));color:var(--muted)}
.clubcard{display:flex;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.clubcard .nm{font-weight:800;line-height:1.2}
.nav{display:flex;flex-direction:column;padding:10px;gap:4px;overflow:auto}
.nav button{all:unset;cursor:pointer;padding:11px 12px;border-radius:10px;color:var(--muted);font-weight:650;display:flex;gap:10px;align-items:center}
.nav button svg{flex:none;opacity:.85}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.on{background:var(--raise);color:var(--text)}
.nav button.on svg{color:var(--accent);opacity:1}
.nav button.locked{opacity:.45;cursor:default}
.nav button .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:auto}
.nav button:focus-visible{outline:2px solid var(--accent)}
.side .foot{margin-top:auto;padding:14px 18px;font-size:calc(13px*var(--tz));color:var(--dim);border-top:1px solid var(--line)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--topbg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.top .date{display:flex;flex-direction:column}
.top .date b{font-size:calc(19px*var(--tz));font-weight:800;line-height:1.1}
.top .next{flex:1;min-width:0;color:var(--muted);font-size:calc(14.5px*var(--tz));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .cash{text-align:right}
.top .cash b{font-family:var(--f-num);font-size:calc(16px*var(--tz))}
#view{padding:26px 28px 96px;max-width:1240px;width:100%}
/* --- boutons --- */
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:750;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:background .15s}
.btn:hover{background:var(--accent-hi)}
.btn.sec{background:var(--raise);color:var(--text);border:1px solid var(--line2)}
.btn.sec:hover{background:#28313b}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--panel2)}
.btn.gold{background:var(--raise);color:var(--text);border:1px solid var(--line2)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:calc(14px*var(--tz));border-radius:8px}
.btn.lg{padding:14px 22px;font-size:calc(17px*var(--tz))}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
/* --- surfaces --- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h3{font-size:calc(18px*var(--tz));margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.vhead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.vhead h2{font-size:calc(30px*var(--tz))}
.eyebrow{font-size:calc(13px*var(--tz));font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:calc(13px*var(--tz));font-weight:650;background:var(--raise);color:var(--muted);white-space:nowrap}
.chip.good{color:var(--good);background:var(--good-soft)} .chip.bad{color:var(--bad);background:var(--bad-soft)}
.chip.gold{color:var(--warn);background:var(--warn-soft)} .chip.acc{color:var(--accent);background:var(--accent-soft)} .chip.info{color:var(--info);background:var(--info-soft)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:calc(15px*var(--tz))}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:calc(12.5px*var(--tz));text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--panel2);font-weight:700;position:sticky;top:0}
td.r,th.r{text-align:right} td.c,th.c{text-align:center}
tbody tr:hover td{background:rgba(255,255,255,.02)}
tr.me td{background:var(--accent-soft)!important}
tr:last-child td{border-bottom:0}
.zone{display:inline-block;width:3px;height:18px;border-radius:2px;vertical-align:middle;margin-right:8px;background:transparent}
.z-c1{background:var(--good)} .z-c2{background:var(--info)} .z-rel{background:var(--bad)}
.pl{cursor:pointer;font-weight:650;border-bottom:1px dotted var(--line2)}
.pl:hover{color:var(--accent)}
.pos{display:inline-block;min-width:38px;text-align:center;padding:2px 0;border-radius:6px;font-size:calc(12.5px*var(--tz));font-weight:800;letter-spacing:.03em}
.pos-GB{background:rgba(216,178,90,.14);color:#e3c47a} .pos-DEF{background:var(--info-soft);color:#8cc0ee} .pos-MIL{background:var(--good-soft);color:#7fd6b0} .pos-ATT{background:var(--accent-soft);color:#f2ab78}
.ovr{display:inline-grid;place-items:center;min-width:36px;height:26px;border-radius:7px;font-family:var(--f-num);font-weight:600;font-size:calc(14px*var(--tz));background:var(--raise);color:var(--text)}
.ovr.t1{color:#aab3bc}.ovr.t2{color:#8fd8b7}.ovr.t3{color:#e7c470}.ovr.t4{color:#f2a76f;background:var(--accent-soft)}.ovr.t5{background:var(--accent);color:var(--accent-ink)}
.bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;min-width:50px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--good)}
.meter{height:8px;border-radius:4px;background:var(--line2);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.kit{display:block;flex:none}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.vs .side-t{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.vs .side-t b{font-size:calc(19px*var(--tz));font-weight:800;line-height:1.15}
.score{font-family:var(--f-disp);font-weight:800;font-size:calc(60px*var(--tz));line-height:.9;letter-spacing:.02em}
.form{display:inline-flex;gap:3px}
.form i{width:18px;height:18px;border-radius:5px;font-style:normal;font-size:calc(12px*var(--tz));font-weight:800;display:grid;place-items:center;color:#0A2418}
.form .V{background:var(--good)} .form .N{background:#8e98a2} .form .D{background:var(--bad)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:center;padding:11px 13px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;min-width:0}
.news .item{align-items:flex-start}
.news .d{font-size:calc(13px*var(--tz));color:var(--dim);white-space:nowrap;padding-top:2px;min-width:84px}
.stat{display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.stat .v{font-family:var(--f-disp);font-size:calc(30px*var(--tz));font-weight:800;line-height:1}
.stat .s{font-size:calc(14px*var(--tz));color:var(--muted)}
.pips{display:flex;gap:4px}.pips i{width:16px;height:6px;border-radius:2px;background:var(--line2)}.pips i.on{background:var(--accent)}
.event{display:flex;flex-direction:column;gap:16px}
.hero{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.hero .kita{display:none}
.hero .in{padding:22px 24px}
.hero h2{font-size:calc(30px*var(--tz))}
.sel{display:flex;flex-wrap:wrap;gap:6px}
.sel button{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:8px 13px;font-weight:650;font-size:calc(14.5px*var(--tz))}
.sel button:hover{border-color:var(--dim)}
.sel button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.sel button:disabled{opacity:.32;cursor:not-allowed}
.cardpick{cursor:pointer;transition:border-color .15s}
.cardpick:hover{border-color:var(--line2)}
.cardpick.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tag{font-size:calc(13px*var(--tz));padding:2px 8px;border-radius:6px;background:var(--raise);color:var(--muted);font-weight:600}
input[type=range]{accent-color:var(--accent);width:100%}
select{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:8px 11px}
.cmp{display:grid;grid-template-columns:120px 1fr 1fr;gap:8px 12px;align-items:center;font-size:calc(14.5px*var(--tz))}
.cmp .h{font-weight:800;font-size:calc(13px*var(--tz));text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.verdict{padding:12px 14px;border-radius:10px;font-weight:700}
.verdict.stay{background:var(--good-soft);color:var(--good)}
.verdict.go{background:var(--bad-soft);color:var(--bad)}
.pitch{position:relative;background:repeating-linear-gradient(90deg,var(--grass1) 0 10%,var(--grass2) 10% 20%);border-radius:12px;aspect-ratio:1.45/1;max-width:100%;overflow:hidden}
.pitch:before{content:"";position:absolute;inset:5%;border:2px solid rgba(238,240,234,.4);border-radius:2px}
.pitch:after{content:"";position:absolute;left:50%;top:5%;bottom:5%;border-left:2px solid rgba(238,240,234,.4)}
.pdot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:1;width:96px}
.pdot i{width:28px;height:28px;border-radius:50%;background:var(--chalk);color:#14201f;display:grid;place-items:center;font-style:normal;font-family:var(--f-num);font-size:calc(12.5px*var(--tz));font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pdot span{font-size:calc(12.5px*var(--tz));font-weight:700;background:rgba(10,16,16,.72);color:#F8F1E1;padding:1px 6px;border-radius:5px;max-width:94px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ov{position:fixed;inset:0;z-index:50;background:rgba(5,8,10,.72);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:100%;max-width:640px;max-height:calc(100% - 20px);overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.modal.wide{max-width:1100px}
.modal h3{font-size:calc(24px*var(--tz))}
#toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--raise);border:1px solid var(--line2);border-left:3px solid var(--accent);color:var(--text);border-radius:10px;padding:10px 14px;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .35s ease-out}
.toast b{color:var(--accent)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(241,90,26,.5)}50%{box-shadow:0 0 0 6px rgba(236,138,67,0)}}
@keyframes tin{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.live{width:100%;max-width:1120px;display:grid;gap:12px}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px}
.board .tm{display:flex;align-items:center;gap:10px;min-width:0}
.board .tm.r{justify-content:flex-end;text-align:right}
.board .tm b{font-size:calc(19px*var(--tz));font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .mid{text-align:center}
.board .sc{font-family:var(--f-disp);font-weight:800;font-size:calc(52px*var(--tz));line-height:.9}
.board .min{font-family:var(--f-num);color:var(--accent);font-weight:600}
.livegrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
#pc{width:100%;height:auto;aspect-ratio:1.55/1;border-radius:12px;display:block;background:var(--grass2)}
.mcard{padding:12px 14px;background:var(--panel2)}.mnote{font-size:calc(20px*var(--tz));color:var(--good);text-align:right;line-height:1}.mnote small{display:block;font-size:calc(10px*var(--tz));color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.mfoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:calc(13px*var(--tz))}.mcard .btn{margin-top:10px;width:100%;justify-content:center}
.mtabs{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))}.mtabs button{white-space:normal;line-height:1.2;text-align:center}
.phero{text-align:center;display:grid;justify-items:center;gap:4px}.phero h2{margin:4px 0 0;font-size:calc(24px*var(--tz))}.pbig{font-family:var(--f-disp);font-size:calc(44px*var(--tz));font-weight:800;color:var(--gold);line-height:1.05}
.panel.tight{padding:12px 14px}.qrow{padding:6px 0;border-top:1px solid var(--line);font-size:calc(14px*var(--tz))}.qrow:first-of-type{border-top:0}
.feed{display:flex;flex-direction:column;gap:6px;max-height:360px;overflow:auto}
.feed .e{display:grid;grid-template-columns:44px 1fr;line-height:1.45;gap:8px;padding:9px 11px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:calc(15px*var(--tz));animation:tin .3s}
.feed .e .m{font-family:var(--f-num);color:var(--muted)}.feed .e b{display:block}.feed .e .d{color:var(--muted);font-size:calc(14px*var(--tz))}.feed .e.yc b{color:var(--gold)}.feed .e.rc b{color:var(--bad)}
.board{position:relative;grid-template-areas:'l l l' 'h m a' 'p p p'}.board .blbl{grid-area:l;text-align:center;font-size:calc(12px*var(--tz));letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:650}
.board .press{grid-area:p}.board>.tm{grid-area:h}.board>.tm.r{grid-area:a}.board>.mid{grid-area:m}.pbar{height:8px;border-radius:8px;background:var(--line2);overflow:hidden;margin:2px 0 6px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#c9842a,var(--accent));transition:width .6s}
.board .ns{display:none}@media (max-width:620px){.board .nl{display:none}.board .ns{display:inline}}
.lview{display:none}@media (max-width:620px){.lview{display:inline-flex}.live.v-txt .pcwrap{display:none}.lview button{padding:4px 10px;font-size:calc(12.5px*var(--tz))}}
.feed .e.goal{border-color:rgba(241,90,26,.5);background:var(--accent-soft)}
.feed .e.goal b{color:var(--accent)}
.splitbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.flash{position:fixed;inset:0;pointer-events:none;display:grid;place-items:center;z-index:70}
.flash div{font-family:var(--f-disp);font-weight:800;font-size:clamp(56px,11vw,140px);color:var(--accent);text-shadow:0 6px 30px rgba(0,0,0,.6);animation:goal 1.6s ease-out forwards}
@keyframes goal{0%{transform:scale(.5);opacity:0}15%{transform:scale(1.05);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
/* écran titre */
.title{min-height:100%;display:flex;flex-direction:column}
.title .wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px;width:100%;display:flex;flex-direction:column;gap:26px}
.tmark svg{width:min(84px,15vw);height:auto}.title h1{font-family:var(--f-disp);font-size:clamp(40px,11.5vw,104px);font-weight:800;line-height:.88;letter-spacing:.005em}
.title h1 em{font-style:normal;color:var(--accent)}.brand{--ring:var(--panel)}.brand b em{font-style:normal;color:var(--accent)}
.pitchline{max-width:62ch;font-size:calc(18px*var(--tz));color:#c9d0d6;line-height:1.55;margin:0}
.clubpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.clubpick button{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}

.xilines{display:grid;gap:3px;font-size:calc(13.5px*var(--tz))}.xilines div{display:grid;grid-template-columns:38px 1fr;gap:6px}.xilines .pl{color:var(--muted);font-weight:700;font-size:calc(12px*var(--tz));padding-top:2px}

.ynext{padding:14px 16px;border-radius:var(--r);border:1px dashed var(--line2);background:var(--panel)}.ynext.live{border:1px solid var(--accent)}.ynext h3{margin:4px 0}.ynext p{margin:0 0 4px;font-size:calc(14px*var(--tz))}.ynext .btn{margin-top:10px;width:100%;justify-content:center}
details.more summary{list-style:none;display:inline-flex}details.more summary::-webkit-details-marker{display:none}
.nlrules{padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px dashed var(--line2);font-size:calc(13.5px*var(--tz));line-height:1.45}
.alea .achoice{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}.alea .achoice:hover,.alea .achoice:focus-visible{border-color:var(--accent)}.alea{gap:10px}
.nplan{gap:8px}.nplan .achoice{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line)}.nplan .achoice.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.nplan .achoice:focus-visible{border-color:var(--accent)}
.nxi{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.nxi div{display:flex;gap:6px;align-items:center;font-size:calc(13.5px*var(--tz));padding:6px 8px;border-radius:9px;background:var(--panel2);min-width:0}.nxi div b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ngr{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.ngr table td,.ngr table th{padding:6px 6px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px}
.qk{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}.qk svg{color:var(--accent)}.qk b{font-size:calc(14px*var(--tz))}.qk span{font-size:calc(12px*var(--tz));color:var(--muted);line-height:1.3}.qk:focus-visible,.qk:hover{border-color:var(--accent)}
.srow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}.srow:first-of-type{border-top:0}.srow select{background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:9px;padding:7px 8px;font-size:calc(13.5px*var(--tz));max-width:100%}
.sqcards{display:none}
@media (max-width:620px){.sqcards{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.sqtable{display:none}
 .sqc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel)}.sqc:first-child{border-top:0}.sqc.on{background:var(--panel2)}
 .sqc .nm{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sqc .sub{display:block;font-size:calc(12.5px*var(--tz))}.sqc input{width:18px;height:18px;accent-color:var(--accent)}}
.tadv{margin:10px 0 0;padding:10px 12px;border-radius:9px;background:var(--panel2);font-size:calc(14px*var(--tz))}
.sbadge{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:calc(13px*var(--tz));letter-spacing:.02em}
.advice{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}.advice p{margin:6px 0 0;font-size:calc(14px*var(--tz))}.advice p.muted{font-size:calc(13.5px*var(--tz))}
.radio{flex:none;width:16px;height:16px;margin-top:3px;border-radius:50%;border:2px solid var(--line2)}.spo.on .radio{border:5px solid var(--accent)}.pre1 .item.spo{flex-wrap:nowrap}
@media (max-width:900px){.top .next.evt{display:none}}
.xichips{display:flex;flex-wrap:wrap;gap:6px}.xichips span{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:3px 7px;font-size:calc(13px*var(--tz))}
.conf{padding:12px 14px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2)}
.kpi2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}.kpi2 .stat{padding:12px 14px}.kpi2 .v{font-size:calc(22px*var(--tz))}.kpi2 small{font-size:.6em;color:var(--muted);font-weight:500}
.conf.flat{padding:0;border:0;background:none}
.decision{margin:12px 0;padding:16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line2);display:grid;gap:6px}.decision h2{margin:0;font-size:calc(22px*var(--tz))}.decision p{margin:0}.decision .btn{justify-content:center;margin-top:8px}
.mrows{display:grid}.mrow{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}.mrow:first-child{border-top:0;padding-top:2px}.mrow .muted{font-size:calc(13.5px*var(--tz))}.mrow .ck{margin-top:2px}
.mtag{flex:none;font-size:calc(12.5px*var(--tz));color:var(--gold);white-space:nowrap}.mtag.acc{color:var(--accent)}
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
/* --- coque mobile --- */
.tabbar{display:none}.m-only{display:none}
.clubcard{flex-wrap:wrap}.cc-prog{flex-basis:100%}
.mprog{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:4px}.mprog i{height:4px;border-radius:2px;background:var(--line2)}.mprog i.on{background:var(--accent);opacity:.55}.mprog i.now{background:var(--accent)}
@media (max-width:900px){
  .m-only{display:inline}.cc-cash{display:flex!important;flex-direction:column;align-items:flex-end;margin-left:auto}.cc-cash b{font-size:calc(16px*var(--tz))}
  .side .nav{display:none}.top{display:none!important}
  .tabbar{display:block;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:8px}
  .tabbar .t5{display:grid;grid-template-columns:repeat(5,1fr);background:var(--tabbg);border:1px solid var(--line2);border-radius:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .tabbar .t5 button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;color:var(--muted);font-size:calc(11.5px*var(--tz));font-weight:650;position:relative}
  .tabbar .t5 button.on{color:var(--accent)}.tabbar .t5 button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
  .tabbar .dot{position:absolute;top:6px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .nextstrip{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;padding:11px 16px;background:var(--accent);color:var(--accent-ink);border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
  .nextstrip .lbl{color:var(--accent-ink);opacity:.75}.nextstrip b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #app{grid-template-columns:minmax(0,1fr);align-content:start}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .side .brand,.side .foot{display:none}
  .clubcard{border-top:0;padding:10px 16px}
  .nav{flex-direction:row;overflow-x:auto;padding:6px 10px}
  .nav button{white-space:nowrap;padding:9px 11px}
  .top{padding:10px 16px;gap:10px;backdrop-filter:none;background:var(--bg)}
  .top .next{order:3;flex-basis:100%}
  .top .go{padding:9px 14px;font-size:calc(14.5px*var(--tz));margin-left:auto}
  .top .cash{margin-left:auto}
  #toasts{bottom:auto;top:calc(10px + env(safe-area-inset-top,0px));left:16px;right:16px;align-items:stretch}
  html{scroll-padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  .toast{max-width:none}
  #view{padding:16px 16px calc(150px + env(safe-area-inset-bottom,0px))}
  .livegrid{grid-template-columns:1fr}
  .board .sc{font-size:calc(38px*var(--tz))}.board .tm b{font-size:calc(15px*var(--tz))}
  .vhead h2,.hero h2{font-size:calc(25px*var(--tz))}.score{font-size:calc(44px*var(--tz))}
  .cmp{grid-template-columns:96px 1fr 1fr}
  .nextcard{grid-template-columns:auto 1fr}.nextcard .go2{grid-column:1/-1}
}
@media (max-width:620px){
  .pitch{aspect-ratio:.8/1}
  .pitch:after{left:5%;right:5%;top:50%;bottom:auto;border-left:0;border-top:2px solid rgba(238,240,234,.4)}
  .pdot{left:calc(var(--y)*1%);top:calc((100 - var(--x))*1%);width:74px}
  .pdot i{width:26px;height:26px}
  .pdot span{max-width:72px;font-size:calc(12px*var(--tz))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* thèmes : vert (défaut), nuit (gris neutre, moins saturé), jour (clair) */
html[data-theme="nuit"]{--bg:#141516;--panel:#1B1C1E;--panel2:#212326;--raise:#282A2D;--line:#2B2D31;--line2:#3B3E43;
  --text:#E6E1D6;--muted:#A19E97;--dim:#6E6C68;--accent:#E0652F;--accent-hi:#EE8152;--accent-soft:rgba(224,101,47,.14);
  --good:#8DAE6E;--good-soft:rgba(141,174,110,.13);--bad:#CC6A53;--bad-soft:rgba(204,106,83,.13);--warn:#D6AC5E;--warn-soft:rgba(214,172,94,.13);--gold:#D6AC5E;--info:#A2B5BE;--info-soft:rgba(162,181,190,.11);
  --grass1:#3a5a40;--grass2:#33503a;--topbg:rgba(20,21,22,.93);--tabbg:rgba(27,28,30,.95)}
html[data-theme="jour"]{--bg:#F3EDE1;--panel:#FBF8F2;--panel2:#F2EBDD;--raise:#E9E0CE;--line:#E1D6C1;--line2:#CDBFA4;
  --text:#1D2A22;--muted:#5B645B;--dim:#868A80;--accent:#D24E12;--accent-hi:#E8601E;--accent-ink:#FFF7EE;--accent-soft:rgba(210,78,18,.10);
  --good:#4C7D33;--good-soft:rgba(76,125,51,.12);--bad:#B0452D;--bad-soft:rgba(176,69,45,.10);--warn:#9C7016;--warn-soft:rgba(156,112,22,.12);--gold:#9C7016;--info:#3D6B74;--info-soft:rgba(61,107,116,.10);
  --grass1:#3f7a49;--grass2:#376c40;--chalk:#F8F1E1;--topbg:rgba(243,237,225,.94);--tabbg:rgba(251,248,242,.96);--shadow:0 1px 0 rgba(255,255,255,.6) inset,0 8px 24px rgba(60,40,10,.10);color-scheme:light}
html[data-theme="jour"] .pitchline{color:var(--muted)}
html[data-theme="jour"] .pos-GB{color:#8a6410}html[data-theme="jour"] .pos-DEF{color:#2c6496}html[data-theme="jour"] .pos-MIL{color:#2f7a52}html[data-theme="jour"] .pos-ATT{color:#b4471a}
html[data-theme="jour"] .ovr.t1{color:#5f6a73}html[data-theme="jour"] .ovr.t2{color:#2f7a52}html[data-theme="jour"] .ovr.t3{color:#8a6410}html[data-theme="jour"] .ovr.t4{color:#b4471a}

/* cartes de joueurs et terrain de composition */
.tbhead{gap:8px;margin-bottom:10px}.ent{display:flex;align-items:baseline;gap:6px}.ent b{font-family:var(--f-disp);font-size:calc(24px*var(--tz))}.ent b.good{color:var(--good)}.ent b.bad{color:var(--bad)}

.tpitch .mk{position:absolute;inset:3.5%;border:2px solid rgba(238,240,234,.35);border-radius:2px;pointer-events:none}

.tpitch .lk2{stroke:#4ade80}.tpitch .lk1{stroke:#f5b942}.tpitch .lk0{stroke:#ef4444}

.pcard .pc-pos{font-size:calc(9.5px*var(--tz));font-weight:800;letter-spacing:.04em;margin-top:2px}
.pcard .pc-kit{flex:1;display:grid;place-items:center;min-height:0}.pcard .pc-kit svg{width:auto;height:100%;max-height:34px}

.pcard .pc-ch{display:flex;gap:2px;margin-top:2px}.pcard .pc-ch i{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.25)}.pcard .pc-ch i.on{background:#15803d}.pcard.t-el .pc-ch i.on{background:#bbf7d0}

.tbbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:10px;font-size:calc(13.5px*var(--tz))}
.bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}

.radar .rl{fill:var(--muted);font-size:10px;font-family:var(--f-body)}.radar .rv{fill:var(--text);font-size:11px;font-weight:700;font-family:var(--f-num)}

function zoneOf(city){if(!city)return null;const z=CITY_ZONE[String(city).split(' · ')[0]];return Array.isArray(z)?pick(z):z||null}
function genUniq(zone,list){const ls=new Set(list.map(x=>x.n.split(' ').slice(1).join(' '))),fs=new Set(list.map(x=>x.n.split(' ')[0]));let n;for(let k=0;k<30;k++){n=genName(zone);if(!ls.has(n.split(' ').slice(1).join(' '))&&!fs.has(n.split(' ')[0]))return n}return n}
function genName(zone){const Z=zone&&NAME_ZONES[zone];let n;do{n=(Z&&R()<.55?pick(Z.f):pick(FIRST))+' '+(Z&&R()<.8?pick(Z.l):pick(LAST))}while(BLOCK.has(n));return n}
function altPos(p){const a=p.at,o=[];if(p.pos==='DEF'&&a.pas>=62&&a.tec>=60)o.push('MIL');if(p.pos==='MIL'&&a.fin>=62)o.push('ATT');if(p.pos==='MIL'&&a.def>=62)o.push('DEF');if(p.pos==='ATT'&&a.pas>=63)o.push('MIL');return o}
function profileOf(p){const a=p.at,sk=(a.tec+a.vit)/2;if(p.pos==='GB')return{k:'gb',l:'Gardien',d:'Spécialiste du poste.'};
  if(sk-a.phy>=18)return{k:'rue',l:'Technicien de rue',d:`Brille au Maracana. À 11, il s'essouffle vite (physique ${a.phy}).`};
  if(a.phy-sk>=10)return{k:'ath',l:'Athlète',d:`Gros moteur, technique à polir (technique ${a.tec}). Utile à 11, moins au Maracana.`};
  const alt=altPos(p);if(alt.length)return{k:'poly',l:'Polyvalent',d:`Peut aussi jouer ${alt.map(x=>({DEF:'défenseur',MIL:'milieu',ATT:'attaquant'})[x]).join(' ou ')}.`};
  return{k:'eq',l:'Équilibré',d:'Pas de point faible marqué.'}}

function genAttrs(pos,ovr){const o={},pf=PROF[pos];for(const k in ATTR)o[k]=clamp(Math.round(ovr+pf[k]+gauss()*3),25,99);return o}
function marketSal(ovr){return Math.round(150000*Math.pow(1.12,ovr-58)/5000)*5000}
function newPlayer(o){
  let nm=o.n;if(!nm){const used=new Set();if(o.club)for(const id in G.players){const q=G.players[id];if(q.club===o.club)used.add(q.n.split(' ').slice(-1)[0])}for(let k=0;k<25;k++){nm=genName(o.zone);if(!used.has(nm.split(' ').slice(-1)[0]))break}}
  const p={id:G.uid++,n:nm,nick:o.nick||'',pos:o.pos,age:o.age,ovr:o.ovr,pot:Math.max(o.ovr,o.pot),club:o.club||null,origin:o.origin||'base',
    sal:o.sal||marketSal(o.ovr),ctr:o.ctr||ri(1,3),clause:o.clause||0,mins:0,apps:0,sg:0,sa:0,cond:100,inj:o.inj||0,pri:o.pri||pick(Object.keys(PRI)),
    known:o.known!==false,rev:o.rev||[],promise:false,share:o.share??.6,from:o.from||'',joined:G.sn||1,peak:o.ovr,rat:[],
    disc:o.disc??clamp(Math.round(62+gauss()*15),15,98),edu:o.edu??(o.age<=21?clamp(Math.round(45+gauss()*20),5,95):null)};
  p.at=genAttrs(p.pos,p.ovr);G.players[p.id]=p;return p}
function effOvr(p){const k=p.age<=21?.6:p.age<=24?.35:.1;return p.ovr+(p.pot-p.ovr)*k}
function valueEUR(p){const ageF=p.age<=23?1:p.age<=27?.85:p.age<=30?.55:.25;return Math.round(15000*Math.pow(1.25,effOvr(p)-60)*ageF/5000)*5000}
function genSquad(cid,tier){
  const comp={GB:2,DEF:7,MIL:7,ATT:4},mean=60+tier*2,ids=[];
  for(const pos in comp)for(let i=0;i<comp[pos];i++){
    const age=ri(18,33),ovr=clamp(Math.round(mean+gauss()*3.2-(i>=comp[pos]-2?2:0)),52,77);
    const pot=ovr+(age<=21?ri(3,12):age<=24?ri(1,6):age<=27?ri(0,2):0);
    ids.push(newPlayer({pos,age,ovr,pot,club:cid,zone:R()<.6?zoneOf(G.clubs[cid]&&G.clubs[cid].city):null,ctr:ri(1,4)}).id)}
  return ids}

function potRange(p){if(p.club!==G.club)return null;const w=p.age>=28?0:Math.max(1,6-G.fac.train-inf('video'))+(p.known?0:2);return [Math.max(p.ovr,p.pot-w),p.pot+w]}

function autoXI(cid,rotate){
  const c=G.clubs[cid],f=FORMS[c.form||'4-3-3'],av=squad(cid).filter(p=>p.inj<=0),xi=[];
  const sc=p=>p.ovr*(rotate?(.7+.3*p.cond/100):1);
  LINES.forEach((pos,i)=>{av.filter(p=>p.pos===pos&&!xi.includes(p.id)).sort((a,b)=>sc(b)-sc(a)).slice(0,f[i]).forEach(p=>xi.push(p.id))});
  LINES.forEach((pos,i)=>{let n=xi.filter(id=>P(id).pos===pos||(P(id).alt&&0)).length;const have=av.filter(p=>xi.includes(p.id)&&p.pos===pos).length;let need=f[i]-have;if(need>0)av.filter(p=>!xi.includes(p.id)&&p.pos!=='GB'&&altPos(p).includes(pos)).sort((a,b)=>sc(b)-sc(a)).slice(0,need).forEach(p=>xi.push(p.id))});
  if(xi.length<11)av.filter(p=>!xi.includes(p.id)&&p.pos!=='GB').sort((a,b)=>sc(b)-sc(a)).slice(0,11-xi.length).forEach(p=>xi.push(p.id));
  return xi}

  st.push({t:'end',m:9},{t:'nou',k:'g0',m:10},{t:'mondial',m:10},{t:'mara1',m:10},{t:'nou',k:'g1',m:10},{t:'mara2',m:10},{t:'nou',k:'g2',m:10},{t:'nou',k:'r16',m:11},{t:'mara3',m:11},{t:'nou',k:'qf',m:11},{t:'nou',k:'sf',m:11},{t:'nou',k:'f',m:11},{t:'nou',k:'bilan',m:11},{t:'review',m:11});
  if(G.prologue==='pending'){const P=[];if(G.start==='district')P.push({t:'drec',m:10,pro:1});for(const k of NOU_ORDER)P.push({t:'nou',k,m:k[0]==='g'?10:11,pro:1});P.push({t:'nou',k:'bilan',m:11,pro:1});return G.start==='district'?P:P.concat(st)}
  return st}
function newCont(kind,ci){const used=G.S?[]:[];
  return{kind,ci:[...ci],prelim:ci.map(id=>({h:id,a:null,r:null})),groups:null,gfx:null,qf:null,sf:null,f:null,out:{},champ:null}}

const LEDGER={sub:'Subvention fédérale',tv:'Droits TV',spo:'Sponsors',bil:'Billetterie',mer:'Maillots vendus',sta:'Staff de recrutement',pri:'Primes sportives',tra:'Ventes de joueurs',sal:'Salaires',ins:'Installations',rec:'Recrutement',div:'Divers',act:'Apport des actionnaires',divi:'Dividendes',nl:'Ligue des Espoirs'};
function addMoney(v,cat){G.cash+=v;G.S.ledger[cat]=(G.S.ledger[cat]||0)+v;const st=G.S.steps&&G.S.steps[G.S.si];if(st&&!st.pro){const L=(G.S.mlog=G.S.mlog||{})[st.m]||(G.S.mlog[st.m]={inc:0,exp:0,res:[]});if(v>=0)L.inc+=v;else L.exp-=v}}

/* ---------------- résultats & simulation ---------------- */
function xg(rh,ra,home){const d=rh-ra+(home?2:0);return[1.35*Math.exp(d/16),1.12*Math.exp(-d/16)]}
function scorerFrom(cid,ids){const ps=(ids||autoXI(cid,false)).map(P);return wpick(ps,ps.map(p=>({GB:.02,DEF:.6,MIL:2.2,ATT:5}[p.pos])*Math.pow(p.ovr/70,2)))}
function quickMatch(h,a,neutral){
  const [xh,xa]=xg(teamStr(h),teamStr(a),!neutral);const r={hg:poisson(xh),ag:poisson(xa)};
  for(const [id,n] of [[h,r.hg],[a,r.ag]])if(isCI(id)&&id!==G.club)for(let i=0;i<n;i++){const p=scorerFrom(id);p.sg++}
  return r}
function pens(){let a=0,b=0;for(let i=0;i<5;i++){a+=R()<.76;b+=R()<.76}while(a===b){a+=R()<.76;b+=R()<.76}return[a,b]}
function winnerOf(f){if(!f.r)return null;if(f.r.hg!==f.r.ag)return f.r.hg>f.r.ag?f.h:f.a;if(!f.r.p)return null;return f.r.p[0]>f.r.p[1]?f.h:f.a}
function simKO(f,neutral){if(f.r)return;f.r=quickMatch(f.h,f.a,neutral);if(f.r.hg===f.r.ag)f.r.p=pens()}

/* ---------------- tables ---------------- */
function table(fxRounds,ids){const t={};ids.forEach(id=>t[id]={id,J:0,G:0,N:0,P:0,bp:0,bc:0,pts:0,form:[]});
  for(const rd of fxRounds)for(const f of rd){if(!f.r||!t[f.h]||!t[f.a])continue;const h=t[f.h],a=t[f.a],x=f.r.hg,y=f.r.ag;h.J++;a.J++;h.bp+=x;h.bc+=y;a.bp+=y;a.bc+=x;
    if(x>y){h.G++;a.P++;h.pts+=3;h.form.push('V');a.form.push('D')}else if(x<y){a.G++;h.P++;a.pts+=3;a.form.push('V');h.form.push('D')}else{h.N++;a.N++;h.pts++;a.pts++;h.form.push('N');a.form.push('N')}}
  return Object.values(t).sort((p,q)=>q.pts-p.pts||(q.bp-q.bc)-(p.bp-p.bc)||q.bp-p.bp||T(p.id).name.localeCompare(T(q.id).name))}
const leagueTable=()=>table(G.S.league.fx,G.S.div===2?G.l2:G.l1);
function formPts(id){const r=leagueTable().find(x=>x.id===id);if(!r)return 0;return r.form.slice(-5).reduce((s,f)=>s+(f==='V'?3:f==='N'?1:0),0)}
function myPos(){return leagueTable().findIndex(r=>r.id===G.club)+1}

/* ---------------- continental ---------------- */
function contOf(kind){return G.S[kind]}
function eliminate(C,id,stage){if(C.out[id])return;C.out[id]=stage;
  if(id===G.club){const pr=PRIZES[C.kind][stage]*USD;addMoney(pr,'pri');G.S.prize=(G.S.prize||0)+pr;
    const gain={prelim:0,group:8,qf:12,sf:17,final:22,win:30}[stage]*(C.kind==='c1'?1:.7);G.rep.caf=clamp(G.rep.caf+gain,0,100);
    newsAdd(`${COMP_NAME[C.kind]} : ${me().name} ${OUT_NAME[stage]}. Prime : ${money(pr)}.`,'cont',true)}}
function formGroups(C){const other=C.kind==='c1'?G.S.c2:G.S.c1;
  const surv=C.prelim.map(winnerOf).filter(Boolean);
  C.prelim.forEach(f=>{const l=winnerOf(f)===f.h?f.a:f.h;if(isCI(l))eliminate(C,l,'prelim');else C.out[l]='prelim'});
  const taken=new Set([...surv,...(other&&other.groups?other.groups.flat():[]),...(other?other.ci:[])]);
  const pool=Object.keys(FX).filter(k=>['nord','sud','ouest','autres'].includes(FX[k].league)&&!taken.has(k)).sort((a,b)=>(teamStr(b)+rf(-4,4))-(teamStr(a)+rf(-4,4)));
  const need=16-surv.length;let chosen=C.kind==='c1'?pool.slice(0,need):pool.slice(Math.max(0,pool.length-need-2)).slice(0,need);
  if(chosen.length<need)chosen=chosen.concat(Object.keys(FX).filter(k=>FX[k].league==='out'&&!taken.has(k)&&!chosen.includes(k)).slice(0,need-chosen.length));
  const all=[...surv,...chosen].sort((a,b)=>teamStr(b)-teamStr(a));const pots=[0,1,2,3].map(i=>shuffle(all.slice(i*4,i*4+4)));
  C.groups=[0,1,2,3].map(g=>pots.map(p=>p[g]).filter(Boolean));
  const pairs=[[[0,1],[2,3]],[[2,0],[1,3]],[[0,3],[1,2]]];
  C.gfx=[];for(let md=0;md<6;md++){const rd=[];C.groups.forEach(gr=>{for(const [x,y] of pairs[md%3]){const [h,a]=md<3?[gr[x],gr[y]]:[gr[y],gr[x]];if(h&&a)rd.push({h,a,r:null})}});C.gfx.push(rd)}
  for(const id of C.groups.flat())if(id===G.club){unlock('groups')}
}
function groupTable(C,g){return table(C.gfx,C.groups[g])}
function formKO(C,k){
  if(k==='qf'){const gt=[0,1,2,3].map(g=>groupTable(C,g));gt.forEach(t=>t.slice(2).forEach(r=>eliminate(C,r.id,'group')));
    C.qf=[[0,1],[1,0],[2,3],[3,2]].map(([a,b])=>({h:gt[a][0].id,a:gt[b][1].id,r:null}));
    const ciPass=C.qf.flatMap(f=>[f.h,f.a]).filter(isCI);G.S.ciPass=(G.S.ciPass||0)+ciPass.length;
    if(C.qf.some(f=>f.h===G.club||f.a===G.club))unlock('qf')}
  if(k==='sf'){C.qf.forEach(f=>eliminate(C,winnerOf(f)===f.h?f.a:f.h,'qf'));C.sf=[{h:winnerOf(C.qf[0]),a:winnerOf(C.qf[1]),r:null},{h:winnerOf(C.qf[2]),a:winnerOf(C.qf[3]),r:null}]}
  if(k==='f'){C.sf.forEach(f=>eliminate(C,winnerOf(f)===f.h?f.a:f.h,'sf'));C.f=[{h:winnerOf(C.sf[0]),a:winnerOf(C.sf[1]),r:null}]}
}
function stageFixtures(C,k){if(!C||!C.ci.length&&!C.groups)return[];
  if(k==='prelim')return C.prelim;
  if(k.startsWith('g')){if(!C.groups)formGroups(C);return C.gfx[+k[1]]}
  if(!C[k])formKO(C,k);return C[k]}

  newsAdd(`${T(w).name} remporte la ${COMP_NAME[C.kind]} !`,'cont',w===G.club);
  if(w===G.club&&C.kind==='c1'){unlock('africa');G.S.mondial={fx:MONDIAL_OPP.map(o=>({h:G.club,a:o[0],r:null})),j:0}}}}

function newsAdd(t,k,hot){G.news.unshift({d:G.S?dateLabel():'Août '+(2025+G.sn),t,k,hot:!!hot});if(G.news.length>80)G.news.pop()}

function stepTick(){const S=G.S;if(S.tick===S.si)return;S.tick=S.si;if(G.staff){staffInit();resolveJobs()}
  {const st=cur();if(st&&st.t==='md'){worldRound(st.i);if(st.i%2===1&&G.role!=='B')nlRound()}}
  const adjB=G.staff&&G.staff.adj&&G.staff.adj.focus==='equipe'?1:0;
  for(const p of squad(G.club)){p.cond=Math.min(100,p.cond+adjB+Math.max(5,9-Math.max(0,p.age-30)*1.2)*(1+.08*inf('medical')));if(p.inj>0)p.inj--;
    if(p.disc<38&&R()<(38-p.disc)/1600){p.cond=Math.max(40,p.cond-12);p.rat.push(5.4);newsAdd(`${p.n} arrive en retard à l'entraînement, encore. Le staff le met à l'écart pour la semaine.`,'club')}}}
function advance(){
  let guard=0;
  while(G&&G.S&&guard++<300){
    if(G.over){if(!(G.ev&&G.ev.t==='end'))G.pending=false;go('event');return}
    const st=cur();if(!st)return;
    onMonth(st.m);stepTick();
    if(prepare(st)){G.pending=true;save();go('event');return}
    G.S.si++;
  }}
function complete(){const mon=G.ev&&G.ev.t==='mondial'&&G.S.mondial&&G.S.mondial.j<3;G.pending=false;G.ev=null;if(!mon)G.S.si++;save();advance()}
function myFixture(list){const j=list.findIndex(f=>f.h===G.club||f.a===G.club);return j<0?null:{f:list[j],j}}
function prepare(st){
  const S=G.S;
  if(G.ev&&G.ev.si===S.si&&G.ev.sn===G.sn)return true; // déjà préparé (rechargement)
  const ev={si:S.si,sn:G.sn,t:st.t};
  if(!st.pro&&G.prologue==='pending'&&G.start!=='district')finishPrologue();
  switch(st.t){
    case 'pre':{const oi=openInc();addMoney(oi.sub,'sub');addMoney(oi.tv,'tv');
      const exp=[...divIds(S.div)].sort((a,b)=>teamStr(b)-teamStr(a)).indexOf(G.club)+1;ev.obj=Math.min(S.div===2?12:13,Math.max(S.div===2?1:2,exp+1));ev.exp=exp;S.obj=ev.obj;S.derby=[];S.fin=G.sn%2===0;
      if(G.sponsor&&G.sponsor.years>0){addMoney(G.sponsor.amt,'spo');G.sponsor.years--;ev.spo=G.sponsor.amt;ev.kept=true}else{ev.offers=sponsorOffers();ev.spo=0}
      G.scoutMarket=scoutCandidates();
      newsAdd(`Saison ${seasonLabel()} : subvention de ${money(oi.sub)} et droits TV de ${money(oi.tv)} versés.`,'fin');break}
    case 'mercato':Object.assign(ev,buildMercato());break;
    case 'md':{const list=S.league.fx[st.i];const m=myFixture(list);ev.match={comp:'l1',h:m.f.h,a:m.f.a,ref:{k:'l1',i:st.i,j:m.j},label:`${divName()} · Journée ${st.i+1}`};ev.phase='pre';break}
    case 'cup':{const rd=cupRound(st.r);const m=myFixture(rd);if(!m){rd.forEach(f=>simKO(f,false));cupClose(st.r);return false}
      ev.match={comp:'cup',h:m.f.h,a:m.f.a,ko:true,ref:{k:'cup',r:st.r,j:m.j},label:`Coupe du Père Fondateur · ${CUP_ROUND[st.r]}`};ev.phase='pre';break}
    case 'co':{let mine=null;for(const kind of ['c1','c2']){const C=S[kind];const list=stageFixtures(C,st.k);const m=myFixture(list);if(m&&!m.f.r)mine={kind,m}}
      if(!mine){simStage(st.k);return false}
      const ko=!st.k.startsWith('g');ev.match={comp:mine.kind,h:mine.m.f.h,a:mine.m.f.a,ko,neutral:st.k==='f',ref:{k:'co',kind:mine.kind,stage:st.k,j:mine.m.j},label:`${COMP_NAME[mine.kind]} · ${STAGE_NAME[st.k]}`};ev.phase='pre';break}
    case 'end':Object.assign(ev,seasonEnd());break;
    case 'mondial':{if(!S.mondial||S.mondial.j>=3)return false;const M=S.mondial;const f=M.fx[M.j];ev.match={comp:'mon',h:f.h,a:f.a,neutral:true,ref:{k:'mon',j:M.j},label:`Mondial des clubs · Match ${M.j+1} / 3`};ev.phase='pre';break}
    case 'comite':ev.zone=null;break;
    case 'tournoi':if(!S.mara||!S.mara.reports.length)return false;ev.choices=[];break;
    case 'mara1':ev.pick=[];break;
    case 'mara2':if(!S.mara||!S.mara.reports.length)return false;ev.choices=[];ev.phase='pick';break;
    case 'mara3':if(!S.mara||!(S.mara.trials||[]).some(t=>!t.cut))return false;ev.q=0;ev.neg=null;break;
    case 'alea':{const a=aleaDraw();if(!a)return false;Object.assign(ev,a);break}
    case 'review':Object.assign(ev,reviewPrep());break;
    case 'inv':{if(G.role&&G.role!=='head')return false;const o=invOffers();if(!o.length)return false;ev.offers=o;break}
    case 'drec':ev.pool=drecPool();break;
    case 'nou':{if(!S.nou)nouInit();if(st.k==='bilan'){nouCatchUp('end');nouFinish();ev.k='bilan';break}
      nouCatchUp(st.k);const list=nouStage(st.k),j=list.findIndex(nouMine);
      if(j<0||list[j].r){for(const f of list)if(!f.r)nouSim(f,st.k[0]!=='g');nouAfter(st.k);return false}
      ev.k=st.k;ev.j=j;ev.phase='pre';ev.plan='simple';break}
  }
  if(G.role==='B'){const r=bAuto(st,ev);if(r!==undefined)return r}
  G.ev=ev;return true}
function cupRound(r){const C=G.S.cup;if(!C.rounds[r]){const prev=C.rounds[r-1];C.rounds[r]=[];for(let i=0;i<prev.length;i+=2)C.rounds[r].push({h:winnerOf(prev[i]),a:winnerOf(prev[i+1]),r:null})}return C.rounds[r]}
function cupClose(r){const rd=G.S.cup.rounds[r];rd.forEach(f=>{const l=winnerOf(f)===f.h?f.a:f.h;G.S.cup.out[l]=r});
  if(r===3){const w=winnerOf(rd[0]);G.S.cup.champ=w;newsAdd(`${T(w).name} remporte la Coupe du Père Fondateur.`,'cup',w===G.club);if(w===G.club){addMoney(50e6,'pri');G.S.prize=(G.S.prize||0)+50e6;unlock('cup')}}
  else if(rd.some(f=>(f.h===G.club||f.a===G.club)&&winnerOf(f)!==G.club))newsAdd(`Coupe du Père Fondateur : ${me().name} sort en ${CUP_ROUND[r].toLowerCase()}.`,'cup')}
function simStage(k){for(const kind of ['c1','c2']){const C=G.S[kind];const list=stageFixtures(C,k);list.forEach(f=>{if(!f.r){if(k.startsWith('g'))f.r=quickMatch(f.h,f.a,false);else simKO(f,k==='f')}});
  if(k==='f')closeStage(C,k)}}
function finishMatchStep(){
  const ev=G.ev,ref=ev.match.ref,S=G.S;
  if(ref.k==='l1'){S.league.fx[ref.i].forEach(f=>{if(!f.r)f.r=quickMatch(f.h,f.a,false)})}
  if(ref.k==='cup'){S.cup.rounds[ref.r].forEach(f=>simKO(f,false));cupClose(ref.r)}
  if(ref.k==='co')simStage(ref.stage);
  if(ref.k==='mon'){/* rien */}
}
function writeResult(ref,hg,ag,p){const S=G.S;let f;
  if(ref.k==='l1')f=S.league.fx[ref.i][ref.j];

function drecPool(){const c=me(),d=distBase(G.club),city=c.city.split(' · ')[0],L=[];const acs=shuffle(ACADEMIES.slice()).slice(0,4);
  for(let i=0;i<7;i++){const a=acs[i%acs.length],ovr=ri(53,61),pot=clamp(ovr+ri(6,14),ovr,86);L.push({id:'r'+(G.uid++),src:'aca',n:genUniq(R()<.5?zoneOf(a.city):null,L.concat(G.u18||[])),pos:pick(['GB','DEF','DEF','MIL','MIL','ATT','ATT']),age:ri(16,18),ovr,pot,from:a.name,fee:Math.round((1.2e6+(ovr-53)*3e5+Math.max(0,pot-64)*1e5)/1e5)*1e5})}
  for(let i=0;i<9;i++){const ovr=ri(48,57),pot=clamp(ovr+ri(6,22),ovr,90);L.push({id:'r'+(G.uid++),src:'com',n:genUniq(R()<.85?zoneOf(c.city):null,L.concat(G.u18||[])),pos:pick(['GB','DEF','DEF','MIL','MIL','ATT','ATT','ATT']),age:ri(15,18),ovr,pot,from:`${pick(['Comité de vacances','Maracana du marché','Maracana de la gare','Tournoi des quartiers'])} · ${city}`,fee:ri(2,8)*1e5})}
  return{L,prof:d?d.prof:'equilibre'}}
function drecFill(n){const need={GB:2,DEF:5,MIL:5,ATT:4};while(G.u18.length<n){const pos=['GB','DEF','MIL','ATT'].find(p=>G.u18.filter(y=>y.pos===p).length<need[p])||pick(['DEF','MIL','ATT']);const ovr=ri(45,50);G.u18.push({id:'u'+(G.uid++),n:genUniq(R()<.85?zoneOf(me().city):null,G.u18),pos,age:ri(15,18),ovr,pot:clamp(ovr+ri(5,15),ovr,80)})}
  if(!G.u18.some(y=>y.pos==='GB')){const ovr=ri(42,47);G.u18.push({id:'u'+(G.uid++),n:genName(zoneOf(me().city)),pos:'GB',age:ri(16,18),ovr,pot:ovr+ri(4,10)})}}
function drecSign(ev,id){const x=ev.pool.L.find(y=>y.id===id);if(!x||x.done||G.cash<x.fee||G.u18.length>=23)return;x.done=1;addMoney(-x.fee,'rec');G.u18.push({id:'u'+(G.uid++),n:x.n,pos:x.pos,age:x.age,ovr:x.ovr,pot:x.pot,from:x.from});save()}
function distGoalHTML(){return `<div class="panel" style="border-color:var(--accent)"><div class="lbl">Ton objectif</div><h3 style="margin:6px 0 8px">Finir parmi les 2 meilleures équipes de district</h3><p class="muted" style="margin:0;font-size:calc(14px*var(--tz))">Pas besoin de gagner la Noushi League : il suffit d'aller plus loin que 14 des 15 autres districts. Les équipes jeunes de Ligue des Pros ne comptent pas. <b style="color:var(--text)">Top 2 des districts</b> : ton club monte en Ligue 2. <b style="color:var(--text)">Vainqueur de la Noushi</b> : en plus, un club de Ligue des Pros t'appelle. <b style="color:var(--text)">Sinon</b> : une équipe B de Ligue des Pros te tend la main.</p></div>`}

/* --- fin du prologue (Noushi League d'ouverture) --- */
function finishPrologue(choice){const S=G.S;if(G.prologue!=='pending')return false;G.prologue='done';
  if(G.start!=='district'){if(S.nou&&S.nou.pro){S.nouPro=S.nou;delete S.nou}return false}
  const N=S.nou,dc=G.club,c=me();G.vacDone=1;
  const qual=!!(N&&N.qual&&N.qual.includes(dc));if(choice==='l2'&&!qual)choice='B';if(choice==='l1'&&!(N&&N.offerL1))choice=qual?'l2':'B';
  if(choice==='l2'){G.role='head';c.pl=genSquad(dc,1);for(const p of squad(dc))p.sal=Math.round(p.sal*.55/5e3)*5e3;if(!G.l2.includes(dc))G.l2.push(dc);
    newsAdd(`${c.name} monte en Ligue 2. Les opérateurs économiques de la région et les supporters financent la première saison professionnelle du club.`,'club',true)}
  else{if(qual){c.pl=genSquad(dc,1);if(!G.l2.includes(dc))G.l2.push(dc)}
    const tgt=choice==='l1'?N.offerL1:(N&&N.offerB)||bOffer();takeClub(tgt,choice==='l1'?'head':'B');
    newsAdd(choice==='l1'?`${T(tgt).name} t'appelle directement en Ligue des Pros après ta Noushi League.`:`${T(tgt).name} te confie son équipe B en Ligue des Espoirs.`,'club',true)}
  while(G.l2.length<16){const k=nouQualified(4).find(k=>!G.clubs[k]);if(!k)break;G.l2.push(entrantClub(k).id)}
  newSeason();save();advance();if(!G.pending)go('home');return true}

/* --- équipe B, Ligue des Espoirs, intérim --- */
function autoPlay(ev){G.ev=ev;const M=prepMatch(ev.match);const E=newEngine(M,{auto:true});eSimAll(E);finalizeMatch(M);afterMatch(ev,M,true);G.ev=null;return M}
function bAuto(st,ev){const S=G.S;
  if(ev.t==='alea'||ev.t==='inv')return false;
  if(ev.t==='pre'){if(ev.offers&&!ev.chosen&&ev.offers.length){signSponsor(ev.offers[0]);ev.chosen=1}if(!S.goal)S.goal=goalKeys()[0];return false}
  if(ev.t==='mercato'){for(const o of ev.offers)if(o.status==='open')resolveOffer(o,'refuse');for(const id of [...ev.free,...ev.expats,...(ev.street||[])]){const p=P(id);if(p&&!p.club)delete G.players[id]}return false}
  if(ev.t==='review'){for(const r of ev.renew){const q=P(r.id);if(q&&capRoom(q.asp?q.ask:q.ask-q.sal)>=0&&(q.ovr>=60||r.pro)){q.sal=q.ask;q.ctr=r.pro?3:2;if(r.pro)q.asp=false;r.dec='keep'}else r.dec='go'}
    for(const f of ev.family){f.dec='promise';const q=P(f.id);if(q)q.qPromise=true}ev.bAuto=1;return undefined}
  if(ev.t==='mondial'){let g=0;while(S.mondial&&S.mondial.j<3&&g++<3){const M0=S.mondial,f=M0.fx[M0.j];autoPlay({si:S.si,sn:G.sn,t:'mondial',match:{comp:'mon',h:f.h,a:f.a,neutral:true,ref:{k:'mon',j:M0.j},label:`Mondial des clubs · Match ${M0.j+1} / 3`},phase:'pre'})}return false}
  if(ev.match){
    if(ev.t==='md'&&!S.intNo&&[9,16,23].includes(st.i)&&!S['ia'+st.i]&&myPos()>=14){S['ia'+st.i]=1;delete ev.match;ev.t='interim';ev.k=st.i;ev.pos=myPos();return undefined}
    const M=autoPlay(ev);
    if(ev.t==='md'&&st.i%2===1&&S.nl&&S.nl.r<S.nl.fx.length){G.ev={si:S.si,sn:G.sn,t:'esp',phase:'pre',first:{h:M.h,a:M.a,hg:M.hg,ag:M.ag,label:ev.match.label}};return true}
    return false}
  return undefined}

/* ======================= NOUSHI LEAGUE · détection des talents (juin–juillet) ======================= */
const NOU_STAGE={g0:'Poules · journée 1',g1:'Poules · journée 2',g2:'Poules · journée 3',r16:'Huitièmes de finale',qf:'Quarts de finale',sf:'Demi-finales',f:'Finale'};
const NOU_ORDER=['g0','g1','g2','r16','qf','sf','f'];
const NOU_REACH=['4e de sa poule','3e de sa poule','Huitièmes de finale','Quarts de finale','Demi-finales','Finaliste','Vainqueur'];
const NOU_PLAN={simple:{l:'Jouer simple',d:'Chacun à son poste, pas de risque inutile.',f:1,a:1,show:0},
  talents:{l:'Laisser jouer les talents',d:'Plus de buts des deux côtés. Les pépites se montrent aux recruteurs.',f:1.2,a:1.18,show:.35},
  bloc:{l:'Bloc et contre',d:'On ferme et on attend l\'erreur. Moins de buts des deux côtés.',f:.8,a:.74,show:-.15}};
function deVille(c){c=c.split(' · ')[0];return /^[AEIOUÉÈ]/i.test(c)?`d'${c}`:`de ${c}`}
function distBase(k){return DISTRICTS.find(d=>d.id===String(k).replace(/_\d$/,''))}
// une équipe de district montée en Ligue 2 devient un club : le district en reforme une nouvelle pour la Noushi League
function distSpec(k){const d=distBase(k);if(!d)return null;const n=+((String(k).match(/_(\d)$/)||[])[1]||1)-1;if(!n)return d;
  const nm=[null,`Racing Club ${deVille(d.city)}`,`Union Sportive ${deVille(d.city)}`,`Étoile ${deVille(d.city)}`,`Jeunesse Club ${deVille(d.city)}`,`Avenir ${deVille(d.city)}`,`Espoir ${deVille(d.city)}`][n]||`${d.name} ${n+1}`;
  return{...d,id:k,name:nm,short:d.short.slice(0,2)+'RUEJAS'[(n-1)%6],c:[d.c[1],d.c[0],d.c[2]]}}
function distKey(d){for(let n=1;n<=7;n++){const k=n===1?d.id:d.id+'_'+n;if(!G.clubs[k])return k}return d.id+'_7'}

/* --- U18 du club --- */
const U18_COMP={GB:2,DEF:6,MIL:6,ATT:4};
function u18New(age,pos){const ovr=clamp(Math.round(43+G.fac.acad*2.5+me().tier*.8+(age-15)*2+gauss()*4),36,64);
  return{id:'u'+(G.uid++),n:genUniq(R()<.75?zoneOf(me().city):null,G.u18||[]),pos,age,ovr,pot:clamp(ovr+ri(8,20)+G.fac.acad,ovr,88)}}
function u18Fill(young){while(G.u18.length<18){let best='MIL',gap=-99;for(const pos in U18_COMP){const g=U18_COMP[pos]-G.u18.filter(y=>y.pos===pos).length;if(g>gap){gap=g;best=pos}}G.u18.push(u18New(young?ri(15,16):ri(15,18),best))}}
function u18Init(){if(G.u18)return;G.u18=[];u18Fill(false)}
function u18Season(){if(!G.u18)return;const gone=[];
  for(const y of G.u18){y.age++;y.ovr=Math.min(y.pot,y.ovr+ri(0,3)+(G.fac.train>=3?1:0))}
  G.u18=G.u18.filter(y=>{if(y.age>18){gone.push(y);return false}return true});u18Fill(true);
  if(gone.length)newsAdd(`${gone.length} joueur${gone.length>1?'s':''} des U18 atteigne${gone.length>1?'nt':''} la limite d'âge sans contrat pro et quitte${gone.length>1?'nt':''} le club. Le groupe U18 est complété par des 15-16 ans.`,'scout')}
function u18Panel(){u18Init();const ys=G.u18.slice().sort((a,b)=>b.pot-a.pot);
  return `<div class="panel" style="margin-top:16px"><div class="row" style="margin-bottom:8px"><h3 style="margin:0">Tes U18 · Noushi League</h3><span class="sp"></span><button class="btn ghost sm" data-gonou>Voir la compétition</button></div>
   <p class="muted" style="margin-top:0">${G.u18.length} joueurs de 15 à 18 ans. ${G.l1.includes(G.club)||inPrologue()?'Ils jouent la Noushi League en juin et juillet. À la fin du tournoi, tu peux faire signer pro les meilleurs.':'Ton club joue en Ligue 2 : ses U18 ne disputent pas la Noushi League, réservée aux équipes jeunes de Ligue des Pros et aux districts.'}</p>
   <div class="list">${ys.map(y=>`<div class="item">${posTag(y.pos)}<b style="flex:1;min-width:0">${esc(y.n)}</b><span class="muted" style="font-size:calc(13px*var(--tz))">${y.age} ans · pot. ${y.pot-3}–${y.pot+3}</span><span class="num">${y.ovr}</span></div>`).join('')}</div></div>`}
function nouPool(){u18Init();const pro=squad(G.club).filter(p=>p.age<=18&&p.inj<=0).sort((a,b)=>b.ovr-a.ovr).slice(0,3).map(p=>({id:'p'+p.id,ref:p.id,n:p.n,pos:p.pos,age:p.age,ovr:p.ovr,pot:p.pot,pro:1}));return G.u18.concat(pro)}
function nouXI(){const st=tbState('u18');const xi=st.arr.filter(Boolean).map(st.getP).filter(Boolean);return xi.length?xi:nouAutoXI()}
function nouEntBonus(){try{const st=tbState('u18');return clamp((tbEntente(st.arr,st.form,st.getP,st.same).score-50)/25,-2,2)}catch(e){return 0}}
function nouMyStr(){const xi=nouXI(),N=G.S&&G.S.nou,dist=N&&N.me>=0&&N.teams[N.me].isD;return xi.reduce((s,p)=>s+p.ovr,0)/Math.max(1,xi.length)+.3*G.fac.train-1.5-(11-xi.length)*3+(dist?3.5:0)+nouEntBonus()}

/* --- tournoi --- */
function nouInit(){const S=G.S;u18Init();G.dStr=G.dStr||{};G.yStr=G.yStr||{};const st=cur(),pro=!!(st&&st.pro),dm=pro&&G.start==='district',hasMe=dm||G.l1.includes(G.club);
  const myBase=dm?distBase(G.club):null;
  const mine={k:dm?G.club:'me',kind:'me',club:G.club,isD:dm,name:dm?me().name:`${me().name} U18`,dist:myBase?myBase.dist:''};
  const pros=G.l1.filter(id=>id!==G.club).map(id=>{const c=T(id),b=46+c.tier*1.6;G.yStr[id]=clamp(Math.round((G.yStr[id]??b+ri(-3,3))*.5+(b+ri(-4,4))*.5),42,64);return{k:'y_'+id,kind:'pro',club:id,name:`${c.name} U18`}});
  const dists=DISTRICTS.filter(d=>d!==myBase).map(d=>{const k=distKey(d),sp=distSpec(k);G.dStr[k]=clamp(Math.round((G.dStr[k]??ri(46,62))*.4+ri(46,62)*.6),44,64);return{k,kind:'dist',name:sp.name,dist:d.dist}});
  const off=hasMe?1:0,teams=hasMe?[mine,...pros,...dists]:[...pros,...dists];
  // 8 poules : 2 équipes jeunes de Ligue des Pros et 2 équipes de district par poule
  const Pi=shuffle(pros.map((_,i)=>i+off)),Di=shuffle(dists.map((_,i)=>i+off+pros.length));if(hasMe){if(dm)Di.unshift(0);else Pi.unshift(0)}
  const groups=[...Array(8)].map((_,g)=>[Pi[g*2],Pi[g*2+1],Di[g*2],Di[g*2+1]]);
  const gfx={g0:[],g1:[],g2:[]};groups.forEach((g,gi)=>{const [a,b,c,d]=g;gfx.g0.push({h:a,a:b,gi},{h:c,a:d,gi});gfx.g1.push({h:a,a:c,gi},{h:d,a:b,gi});gfx.g2.push({h:d,a,gi},{h:b,a:c,gi})});
  S.nou={yr:2026+G.sn-(pro?1:0),pro,me:hasMe?0:-1,teams,groups,gfx,ko:{},st:{},out:{},done:{},champ:null};
  newsAdd(hasMe?`Tirage de la Noushi League ${S.nou.yr} : ${mine.name} dans la poule A avec ${groups[0].filter(i=>i!==0).map(i=>teams[i].name).join(', ')}.`:`Noushi League ${S.nou.yr} : 32 équipes, sans ton club, qui joue en Ligue 2.`,'scout')}
function nouStr(i){const t=G.S.nou.teams[i];return t.kind==='me'?nouMyStr():t.kind==='pro'?G.yStr[t.club]:G.dStr[t.k]}
function nouSim(f,ko,plan){const P0=NOU_PLAN[plan||'simple'],d=(nouStr(f.h)-nouStr(f.a))/5;
  let xh=clamp(1.3+.42*d,.25,3.6),xa=clamp(1.3-.42*d,.25,3.6);
  if(plan){if(f.h===G.S.nou.me){xh*=P0.f;xa*=P0.a}else{xa*=P0.f;xh*=P0.a}}
  const r={hg:poisson(xh),ag:poisson(xa),p:null};
  if(ko&&r.hg===r.ag){let a=0,b=0;for(let k=0;k<5;k++){a+=R()<.75?1:0;b+=R()<.75?1:0}while(a===b){a+=R()<.75?1:0;b+=R()<.75?1:0}r.p=[a,b]}
  f.r=r;return r}
function nouWin(f){const r=f.r;if(!r)return null;if(r.hg!==r.ag)return r.hg>r.ag?f.h:f.a;if(!r.p)return null;return r.p[0]>r.p[1]?f.h:f.a}
function nouGroupTable(gi){const N=G.S.nou,t={};for(const i of N.groups[gi])t[i]={i,J:0,pts:0,bp:0,bc:0};
  for(const k of ['g0','g1','g2'])for(const f of N.gfx[k])if(f.gi===gi&&f.r){const h=t[f.h],a=t[f.a];h.J++;a.J++;h.bp+=f.r.hg;h.bc+=f.r.ag;a.bp+=f.r.ag;a.bc+=f.r.hg;if(f.r.hg>f.r.ag)h.pts+=3;else if(f.r.hg<f.r.ag)a.pts+=3;else{h.pts++;a.pts++}}
  return Object.values(t).sort((x,y)=>y.pts-x.pts||(y.bp-y.bc)-(x.bp-x.bc)||y.bp-x.bp||nouStr(y.i)-nouStr(x.i))}
function nouStage(k){const N=G.S.nou;if(k[0]==='g')return N.gfx[k];
  if(!N.ko[k]){if(k==='r16'){const T2=N.groups.map((_,gi)=>nouGroupTable(gi)),o=[];
      for(let g=0;g<8;g+=2)o.push({h:T2[g][0].i,a:T2[g+1][1].i},{h:T2[g+1][0].i,a:T2[g][1].i});
      // les deux qualifiés d'une même poule ne peuvent se retrouver qu'en finale de leur moitié de tableau
      N.ko.r16=[o[0],o[2],o[1],o[3],o[4],o[6],o[5],o[7]]}
    else{const pr=nouStage({qf:'r16',sf:'qf',f:'sf'}[k]);N.ko[k]=[];for(let j=0;j<pr.length;j+=2)N.ko[k].push({h:nouWin(pr[j]),a:nouWin(pr[j+1])})}}
  return N.ko[k]}
function nouAfter(k){const N=G.S.nou;if(N.done[k])return;N.done[k]=1;
  if(k==='g2'){N.groups.forEach((_,gi)=>{const tb=nouGroupTable(gi);N.out[tb[2].i]=1;N.out[tb[3].i]=0});nouStage('r16')}
  else if(k[0]!=='g'){const lv={r16:2,qf:3,sf:4,f:5}[k];for(const f of nouStage(k)){const w=nouWin(f),l=w===f.h?f.a:f.h;N.out[l]=lv;if(k==='f'){N.out[w]=6;N.champ=w}}}}
function nouCatchUp(k){const N=G.S.nou;for(const s of NOU_ORDER){if(s===k)return;if(!N.done[s]){for(const f of nouStage(s))if(!f.r)nouSim(f,s[0]!=='g',nouMine(f)?'simple':null);nouAfter(s)}}}
function nouPlay(ev,plan){const N=G.S.nou,f=nouStage(ev.k)[ev.j];if(f.r&&ev.res)return;const ko=ev.k[0]!=='g',xi=nouXI(),P0=NOU_PLAN[plan]||NOU_PLAN.simple;
  const r=f.r||nouSim(f,ko,plan),home=f.h===N.me,my=home?r.hg:r.ag,op=home?r.ag:r.hg;
  const goals=[];for(let g=0;g<my;g++){const p=wpick(xi,xi.map(q=>({ATT:5,MIL:3,DEF:1,GB:0})[q.pos]+.01));goals.push({m:ri(2,90),mine:1,id:p.id,n:p.n})}
  {const ot=N.teams[f.h===N.me?f.a:f.h],oc=ot.kind==='dist'?(distBase(ot.k)||{}).city:(T(ot.club)||{}).city;for(let g=0;g<op;g++)goals.push({m:ri(2,90),mine:0,n:genName(R()<.8?zoneOf(oc):null)})}goals.sort((a,b)=>a.m-b.m);
  const avg=xi.reduce((s,p)=>s+p.ovr,0)/xi.length;
  const rat=xi.map(p=>{const g=goals.filter(x=>x.id===p.id).length;
    let v=6.3+(p.ovr-avg)/9+g*.9+(my>op?.3:my<op?-.3:0)+rf(-.6,.6)+((p.pos==='GB'||p.pos==='DEF')?(op===0?.4:-op*.15):0)+(P0.show&&p.pot-p.ovr>=14?P0.show:0);v=Math.round(clamp(v,4.5,9.8)*10)/10;
    const s=N.st[p.id]||(N.st[p.id]={apps:0,g:0,rs:[]});s.apps++;s.g+=g;s.rs.push(v);return{id:p.id,n:p.n,pos:p.pos,r:v,g}}).sort((a,b)=>b.r-a.r);
  ev.res={hg:r.hg,ag:r.ag,p:r.p,goals,rat,plan,my,op};
  for(const g of nouStage(ev.k))if(!g.r)nouSim(g,ko);nouAfter(ev.k);ev.phase='post';save()}
function nouMyWon(f){return nouWin(f)===G.S.nou.me}
function nouMine(f){const m=G.S.nou.me;return m>=0&&(f.h===m||f.a===m)}
function nouRank(){const N=G.S.nou,pts={};N.groups.forEach((_,gi)=>nouGroupTable(gi).forEach(r=>pts[r.i]=r));
  return N.teams.map((t,i)=>i).sort((a,b)=>(N.out[b]??0)-(N.out[a]??0)||pts[b].pts-pts[a].pts||(pts[b].bp-pts[b].bc)-(pts[a].bp-pts[a].bc)||nouStr(b)-nouStr(a))}
function nouFinish(){const N=G.S.nou;if(N.fin)return;N.fin=1;
  const hasMe=N.me>=0,reach=hasMe?(N.out[N.me]??0):null,rk=nouRank();
  const need=N.pro?2:4-Math.min(2,acTable().filter(r=>!G.clubs[r.id]).length);
  N.qual=rk.filter(i=>{const t=N.teams[i];return t.isD||(t.kind==='dist'&&!G.clubs[t.k])}).slice(0,need).map(i=>N.teams[i].k);
  N.my={reach,rep:0,prize:0};N.grown=[];N.rev=[];N.signs=0;
  if(hasMe){const rep=[0,0,1,2,3,4,6][reach],prize=[0,0,1e6,2e6,4e6,6e6,10e6][reach];G.rep.form=clamp(G.rep.form+rep,0,100);if(prize){addMoney(prize,'pri');G.S.prize=(G.S.prize||0)+prize}N.my={reach,rep,prize};
    for(const y of nouPool()){const s=N.st[y.id];if(!s||s.apps<2)continue;const a=s.rs.reduce((x,v)=>x+v,0)/s.rs.length;if(a>=7&&y.ovr<y.pot){if(y.ref){const q=P(y.ref);if(q)q.ovr++}else y.ovr++;N.grown.push(y.id)}}
    // révélations : un joueur des équipes de district les plus en vue
    if(!N.teams[N.me].isD)N.rev=rk.filter(i=>N.teams[i].kind==='dist').slice(0,3).map(i=>{const t=N.teams[i],ovr=clamp(Math.round(G.dStr[t.k]-1+gauss()*3),46,68),pot=clamp(ovr+ri(8,18),ovr,90);
      return{i,n:genName(R()<.85?zoneOf(distBase(t.k)&&distBase(t.k).city):null),pos:pick(['DEF','MIL','ATT','ATT','MIL']),age:ri(16,18),ovr,pot,from:t.name,dist:t.dist,fee:Math.round(clamp(1.5e6+(pot-62)*4e5,1.5e6,9e6)/1e5)*1e5,done:0}})}
  if(N.pro){for(const k of N.qual){if(k===G.club||G.l2.includes(k)||G.clubs[k])continue;if(G.l2.length<16)G.l2.push(entrantClub(k).id)}
    if(G.start==='district'){N.offerB=bOffer();if(reach===6){const w=G.l1.slice().sort((a,b)=>teamStr(a)-teamStr(b));N.offerL1=w[ri(0,3)]}}}
  G.nouHist=G.nouHist||[];G.nouHist.push({yr:N.yr,champ:N.teams[N.champ].name,qual:N.qual.map(nouQName),my:reach});
  newsAdd(`Noushi League ${N.yr} : ${N.teams[N.champ].name} l'emporte. ${N.qual.map(nouQName).join(' et ')} montent en Ligue 2.${hasMe?` ${N.teams[N.me].name} : ${NOU_REACH[reach].toLowerCase()}.`:''}`,'scout',true)}
function nouQualified(n){const S=G.S,N=S.nou,q=N&&N.qual?N.qual.slice(0,n):[];
  if(q.length<n){G.dStr=G.dStr||{};const pool=DISTRICTS.map(d=>distKey(d)).filter(k=>!q.includes(k)&&!G.clubs[k]).sort((a,b)=>(G.dStr[b]??50)-(G.dStr[a]??50));while(q.length<n&&pool.length)q.push(pool.shift())}
  return q}
function nouSignU18(id){const N=G.S.nou,y=G.u18.find(x=>x.id===id);if(!y||N.signs>=3)return;
  const p=newPlayer({n:y.n,pos:y.pos,age:y.age,ovr:y.ovr,pot:y.pot,club:G.club,ctr:3,sal:40000,origin:'academie',known:true});me().pl.push(p.id);p.nou=N.st[id]||null;

  const bias={technique:{tec:6,pas:3},vitesse:{vit:8},physique:{phy:7,def:2},equilibre:{men:3}}[T0.prof];for(const k in bias)p.at[k]=clamp(p.at[k]+bias[k],20,99);
  if(street){p.at.vit=ri(76,90);p.at.tec=ri(76,91);p.at.phy=ri(30,47);p.at.men=ri(33,50)}

// sauvegarde en ligne : un document est limité à 256 Ko, donc la partie est compressée (si le navigateur sait le faire) puis découpée en morceaux
const CLOUD_CH=180000;let cloudDb=null,cloudUid=null,cloudNext=null,cloudBusy=false,cloudSt='';
async function gz(str){if(typeof CompressionStream==='undefined')return null;try{const cs=new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());let bin='';for(let i=0;i<buf.length;i+=32768)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+32768));return btoa(bin)}catch(e){return null}}
async function gunz(b64){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(ds).text()}
async function cloudPush(){if(cloudBusy||!cloudNext||!cloudDb)return;cloudBusy=true;const {s,t}=cloudNext;cloudNext=null;
  try{const z=await gz(s),body=z||s,n=Math.max(1,Math.ceil(body.length/CLOUD_CH)),base='data/users/'+cloudUid+'/';
    for(let i=0;i<n;i++)await cloudDb.doc(base+'save_'+i).set({s:body.slice(i*CLOUD_CH,(i+1)*CLOUD_CH)});
    await cloudDb.doc(base+'save').set({t,n,z:!!z,v:2});cloudSt='ok'}
  catch(e){cloudSt=(e&&e.code)||'erreur'}
  cloudBusy=false;if(cloudNext)setTimeout(cloudPush,1500)}
async function cloudLoad(d){if(!d)return null;if(d.json)return d.json;if(!d.n)return null;const base='data/users/'+cloudUid+'/';let body='';
  for(let i=0;i<d.n;i++){const sn=await cloudDb.doc(base+'save_'+i).get();if(!sn.exists)return null;body+=sn.data().s||''}
  return d.z?await gunz(body):body}
async function initCloud(){try{if(!window.claude||!window.claude.use)return;const db=await window.claude.use('db');const user=await window.claude.use('user');if(!db||!user)return;
  const id=await user.id();if(!id)return;cloudDb=db;cloudUid=id;cloud=db.doc('data/users/'+id+'/save');const snap=await cloud.get();
  if(snap.exists){const d=snap.data();const local=loadLocal();if(d&&(!local||d.t>(local.t||0))){try{const js=await cloudLoad(d);if(js){const g=JSON.parse(js);try{localStorage.setItem(LS,js)}catch(e){};if(!G)renderTitle(g)}}catch(e){}}}
  // une partie locale plus récente que celle du compte : on la remonte tout de suite
  const local=loadLocal();if(local&&(!snap.exists||(snap.data().t||0)<(local.t||0))){cloudNext={s:JSON.stringify(local),t:local.t||Date.now()};cloudPush()}}catch(e){}}

/* ======================= COMPOSITION EN CARTES · ENTENTE · FICHES ======================= */
// emplacements d'une formation, du gardien aux attaquants
function tbSlots(form){const f=FORMS[form]||FORMS['4-3-3'],out=[];LINES.forEach((pos,i)=>{for(let k=0;k<f[i];k++)out.push(pos)});return out}
// coordonnées (en %) de chaque emplacement sur un terrain vertical
function tbCoords(form){const f=FORMS[form]||FORMS['4-3-3'],ys=[88,68,44,20],out=[];
  LINES.forEach((pos,li)=>{const n=f[li];for(let k=0;k<n;k++){const x=n===1?50:10+80*(k/(n-1));out.push({x:n===1?50:(n===2?(k?66:34):x),y:ys[li]})}});return out}
// range des joueurs dans les emplacements : d'abord à leur poste, puis là où il reste de la place
function tbNormalize(ids,form,getP){const slots=tbSlots(form),arr=Array(slots.length).fill(null),left=ids.filter(id=>id!=null&&getP(id));
  slots.forEach((pos,i)=>{const j=left.findIndex(id=>getP(id).pos===pos);if(j>=0)arr[i]=left.splice(j,1)[0]});
  slots.forEach((pos,i)=>{if(arr[i]==null&&left.length)arr[i]=left.shift()});return arr}
function pZone(p){if(!p)return null;if(p.z!==undefined)return p.z;const ln=p.n.split(' ').slice(1).join(' ');let z=null;for(const k in NAME_ZONES)if(NAME_ZONES[k].l.includes(ln)){z=k;break}p.z=z;return z}
function pTier(o){return o>=80?'el':o>=70?'or':o>=60?'ag':'br'}
// liens d'entente : même région ou même formation = vert, à son poste = orange, hors poste = rouge
function tbEntente(arr,form,getP,same){const slots=tbSlots(form),co=tbCoords(form),f=FORMS[form]||FORMS['4-3-3'],rows=[];let k=0;
  LINES.forEach((_,li)=>{const r=[];for(let j=0;j<f[li];j++)r.push(k++);rows.push(r)});
  const pairs=[];rows.forEach((r,ri)=>{for(let j=0;j+1<r.length;j++)pairs.push([r[j],r[j+1]]);const nx=rows[ri+1];if(nx)for(const a of r){const b=nx.slice().sort((u,v)=>Math.abs(co[u].x-co[a].x)-Math.abs(co[v].x-co[a].x))[0];pairs.push([a,b])}});
  const oop=i=>{const p=arr[i]!=null?getP(arr[i]):null;return !p||(p.pos!==slots[i]&&!(p.at&&altPos(p).includes(slots[i])))};
  const links=pairs.map(([a,b])=>{const pa=arr[a]!=null?getP(arr[a]):null,pb=arr[b]!=null?getP(arr[b]):null;let c=1;
    if(!pa||!pb||oop(a)||oop(b))c=0;else if((pZone(pa)&&pZone(pa)===pZone(pb))||same(pa,pb))c=2;return{a,b,c}});
  const chem=arr.map((_,i)=>{if(oop(i))return 0;const g=links.filter(l=>(l.a===i||l.b===i)&&l.c===2).length;return Math.min(3,1+g)});
  const score=Math.round(chem.reduce((s,x)=>s+x,0)/(arr.length*3)*100);return{links,chem,score,oop}}
function tbSameFirst(a,b){return (homegrown(a)&&homegrown(b))||(a.origin&&a.origin===b.origin&&['maracana','district','expat'].includes(a.origin))}

/* --- fiche joueur : radar à six qualités --- */
const RADAR=[['vit','Vitesse'],['fin','Finition'],['pas','Passe'],['tec','Dribble'],['def','Défense'],['phy','Physique']];
function radarSVG(at,known){const cx=110,cy=100,R=72,pt=(i,v)=>{const a=-Math.PI/2+i*Math.PI/3,r=R*clamp(v,0,99)/99;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const grid=[.25,.5,.75,1].map(f=>`<polygon points="${RADAR.map((_,i)=>pt(i,99*f).join(',')).join(' ')}" class="rg"/>`).join('');
  const axes=RADAR.map((_,i)=>{const [x,y]=pt(i,99);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" class="rg"/>`}).join('');
  const poly=RADAR.map(([k],i)=>pt(i,at[k]).join(',')).join(' ');
  const lab=RADAR.map(([k,l],i)=>{const [x,y]=pt(i,99*1.32);return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" class="rl">${l}</text><text x="${x}" y="${y+12}" text-anchor="middle" dominant-baseline="middle" class="rv">${known?at[k]:'?'}</text>`}).join('');
  return `<svg class="radar" viewBox="0 0 220 210" role="img" aria-label="Radar des qualités">${grid}${axes}<polygon points="${poly}" class="rp ${known?'':'est'}"/>${lab}</svg>`}
function starsHTML(n){return `<span class="stars">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}">★</i>`).join('')}</span>`}
function hashN(s){let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h)}
function extraTraits(p){const a=p.at,h=hashN(p.id+p.n);return{foot:h%4===0?'Gauche':'Droit',weak:1+h%3+(a.tec>=70?1:0),skills:clamp(Math.round((a.tec-35)/12),1,5),
  att:a.fin+a.vit>140?'Élevé':a.fin+a.vit>115?'Moyen':'Faible',dfn:a.def+a.phy>140?'Élevé':a.def+a.phy>115?'Moyen':'Faible'}}
function ficheTop(p,{known=true,sub=''}={}){const a=p.at,o=known?p.ovr:(p.scoutNote??p.ovr),t=extraTraits(p);

    <div class="fgrid">${radarSVG(a,known)}<div class="fbars">${bars}${known?'':'<p class="muted" style="margin:6px 0 0;font-size:calc(12.5px*var(--tz))">Qualités exactes inconnues : elles se révèlent après quelques matchs.</p>'}</div></div>`}

function cashChart(box){const d=G.cashHist;if(d.length<2){box.innerHTML='<p class="muted">Le graphique apparaît après le premier mois.</p>';return}
  const W=900,H=220,pl=64,pr=34,pt=12,pb=26;const vals=d.map(x=>x.v);let mn=Math.min(0,...vals),mx=Math.max(...vals);if(mx===mn)mx=mn+1;

  const X=i=>pl+i*(W-pl-pr)/(d.length-1),Y=v=>pt+(mx-v)*(H-pt-pb)/(mx-mn);
  const ticks=[mn,mn+(mx-mn)/2,mx];let path='',area='';d.forEach((p,i)=>{path+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)});area=path+`L${X(d.length-1)} ${Y(Math.max(mn,0))} L${X(0)} ${Y(Math.max(mn,0))}Z`;

   ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${money(t).replace(' FCFA','')}</text>`).join('')}
   <path d="${area}" fill="var(--accent)" opacity=".14"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
   ${d.map((p,i)=>i%step===0||i===d.length-1?`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${p.l}</text>`:'').join('')}

     <div class="list">${INTEREST.map(d=>`<div class="item" style="flex-wrap:wrap"><div style="min-width:160px;flex:1"><b>${esc(d.l)}</b><div class="quote" style="font-size:calc(14px*var(--tz))">${esc(d.q)}</div></div><span class="num muted">${d.cost?money(d.cost):'sans coût'}</span>

function evReview(el,ev){const y=P(ev.youth);ev.family=ev.family||[];ev.resales=ev.resales||[];
  const dev=ev.dev.map(d=>({...d,p:P(d.id)})).filter(d=>d.p).sort((a,b)=>b.d-a.d);
  const pend=ev.renew.some(r=>!r.dec)||ev.family.some(f=>!f.dec);
  el.innerHTML=`<div class="event"><div class="hero"><div class="kita"></div><div class="in"><div class="eyebrow">Juillet · bilan</div><h2>Bilan de la saison ${seasonLabel()}</h2>
   <p class="pitchline" style="font-size:calc(16.5px*var(--tz))">Les joueurs vieillissent d'un an et progressent selon leur âge, leurs minutes, leur programme et ton centre d'entraînement. Règle les fins de contrat et écoute les familles avant d'attaquer la saison ${G.sn+1}.</p></div></div>
   <div class="grid g2">
    <div class="panel"><h3>Progression</h3><div class="list">${dev.slice(0,10).map(d=>`<div class="item">${posTag(d.p.pos)}${pl(d.p)}<span class="muted">${d.p.age} ans</span><span class="sp"></span><b class="num ${d.d>0?'good':'bad'}">${d.d>0?'+':''}${d.d}</b>${ovrTag(d.p)}</div>`).join('')||'<span class="muted">Aucun changement notable.</span>'}</div></div>
    <div class="panel"><h3>Fins de contrat</h3>${ev.renew.length?`<div class="list">${ev.renew.map(r=>{const p=P(r.id);if(!p)return'';const add=p.asp?p.ask:p.ask-p.sal;return `<div class="item" style="flex-wrap:wrap">${posTag(p.pos)}${ovrTag(p)}<div style="min-width:150px;flex:1">${pl(p)}<div class="muted" style="font-size:calc(13.5px*var(--tz))">${p.age} ans · ${r.pro?'fin du contrat aspirant, passage pro · ':''}demande ${money(p.ask)}/mois</div></div>
        ${r.dec==='keep'?'<span class="chip good">'+(r.pro?'Passé pro':'Prolongé')+'</span>':r.dec==='go'?'<span class="chip">Libéré</span>':`<button class="btn sm" data-keep="${p.id}" ${capRoom(add)<0?'disabled':''}>${r.pro?'Passer pro 3 ans':'Prolonger 2 ans'}</button><button class="btn ghost sm" data-go="${p.id}">Libérer</button>`}</div>`}).join('')}</div>`:'<span class="muted">Aucun contrat n\'arrive à échéance.</span>'}</div>
    ${ev.family.length?`<div class="panel"><h3>La famille demande des comptes</h3><p class="muted" style="margin-top:0;font-size:calc(14.5px*var(--tz))">Ces pépites ont trop peu joué. Au quartier, on parle. La famille veut une promesse, sinon elle reprend son enfant.</p><div class="list">${ev.family.map(f=>{const p=P(f.id);if(!p)return'';return `<div class="item" style="flex-wrap:wrap">${posTag(p.pos)}<div style="min-width:150px;flex:1">${pl(p)}<div class="muted" style="font-size:calc(13.5px*var(--tz))">${p.age} ans · ${pct(p.share)} des minutes cette saison</div></div>
        ${f.dec==='promise'?'<span class="chip acc">Temps de jeu promis</span>':f.dec==='release'?'<span class="chip">Contrat rompu</span>':`<button class="btn sm" data-fp="${p.id}">Promettre du temps de jeu</button><button class="btn ghost sm" data-fr="${p.id}">Rompre le contrat</button>`}</div>`}).join('')}</div></div>`:''}
    <div class="panel"><h3>Arrivée de l'académie</h3>${y?`<div class="item">${posTag(y.pos)}${ovrTag(y)}<div style="min-width:0">${pl(y)}<div class="muted" style="font-size:calc(13.5px*var(--tz))">${y.age} ans · académie ${ACAD[G.fac.acad]} · ${y.asp?'contrat aspirant':'contrat jeune pro'} · attributs cachés</div></div></div>`:''}</div>
    <div class="panel"><h3>Départs</h3><div class="list">${ev.gone.map(g=>`<div class="item"><b>${esc(g.n)}</b><span class="sp"></span><span class="muted">${esc(g.why)}</span></div>`).join('')||'<span class="muted">Aucun départ automatique.</span>'}</div></div>
    ${(()=>{const y=yearNow(),list=Object.values(G.track||{}).filter(t=>t.status!=='club'&&t.ev.some(e=>e.y===y));return list.length?`<div class="panel"><h3>Nouvelles de tes anciens</h3><div class="list">${list.map(t=>`<button class="item" data-track="${t.id}"><b>${esc(t.n)}</b><span class="muted" style="flex:1;min-width:0">${esc(t.ev[t.ev.length-1].t)}</span></button>`).join('')}</div></div>`:''})()}
    ${ev.resales.length?`<div class="panel"><h3>Clauses de revente</h3><div class="list">${ev.resales.map(r=>`<div class="item"><b>${esc(r.n)}</b><span class="muted">revendu ${eur(r.fee)} · clause ${r.pct} %</span><span class="sp"></span><b class="num goldt">+${money(r.inc)}</b></div>`).join('')}</div></div>`:''}
   </div>
   <div class="row"><button class="btn" data-primary id="ok" ${pend?'disabled':''}>${G.sn>=MAX_SEASONS?'Terminer la carrière ›':`Lancer la saison ${G.sn+1} ›`}</button>${pend?'<span class="muted">Décide pour chaque contrat et chaque famille.</span>':''}</div></div>`;
  el.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>trackModal(+b.dataset.track));
  el.querySelectorAll('[data-keep]').forEach(b=>b.onclick=()=>{const p=P(+b.dataset.keep);const r=ev.renew.find(x=>x.id===p.id);p.sal=p.ask;p.ctr=r.pro?3:2;if(r.pro){p.asp=false;if(G.track&&G.track[p.id]){trackEv(p.id,'Signe son premier contrat professionnel.');G.track[p.id].flags.pro=1}}r.dec='keep';save();refresh()});
  el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ev.renew.find(r=>r.id===+b.dataset.go).dec='go';save();refresh()});
  el.querySelectorAll('[data-fp]').forEach(b=>b.onclick=()=>{ev.family.find(f=>f.id===+b.dataset.fp).dec='promise';P(+b.dataset.fp).qPromise=true;save();refresh()});
  el.querySelectorAll('[data-fr]').forEach(b=>b.onclick=()=>{ev.family.find(f=>f.id===+b.dataset.fr).dec='release';save();refresh()});
  el.querySelector('#ok').onclick=()=>{for(const r of ev.renew)if(r.dec==='go'){const p=P(r.id);if(p){newsAdd(`${p.n} quitte le club en fin de contrat.`,'transfer');removeFromClub(p)}}
    for(const f of ev.family)if(f.dec==='release'){const p=P(f.id);if(p){newsAdd(`La famille de ${p.n} reprend son enfant. Le quartier s'en souviendra.`,'club',true);G.rep.form=clamp(G.rep.form-5,0,100);G.ferveur=clamp(G.ferveur-5,0,100);removeFromClub(p)}}
    G.lastLedger={...G.S.ledger};G.pending=false;G.ev=null;startNextSeason()}}

function renderTitle(saved){

   ${has?`<div class="nextcard" style="max-width:640px"><div class="ico" style="background:none">${kit(saved.clubs[saved.club],52)}</div><div style="min-width:0"><div class="lbl">Partie en cours</div><h2 style="margin:4px 0;font-size:calc(21px*var(--tz))">${esc(saved.clubs[saved.club].name)}</h2><div class="muted">Saison ${saved.sn} · trésorerie ${money(saved.cash)}</div></div><button class="btn lg go2" id="cont">Reprendre ${icon('next',18)}</button><button class="btn ghost sm" id="wipe" style="margin-top:8px">Effacer cette partie</button></div>`:''}
   <div><h2 style="font-size:calc(22px*var(--tz));margin-bottom:10px">${has?'Ou commence une nouvelle carrière':'Choisis ton départ'}</h2>

   <div id="m-dis" hidden><p class="muted" style="margin:0 0 14px">Choisis ta région. Les opérateurs économiques et les supporters financent l'équipe du district. Recrute tes U18 dans les académies et les comités, puis joue la Noushi League : les 2 meilleures équipes de district montent en Ligue 2. Sinon, un club de Ligue des Pros te proposera son équipe B.</p>
   <div class="clubpick">${DISTRICTS.map(d=>`<button data-d="${d.id}">${kit({c1:d.c[0],c2:d.c[1],pat:d.c[2]},52)}<span style="min-width:0"><b>${esc(d.name)}</b><small>${esc(d.dist)}</small><small>${esc(d.city)} · profil ${PROF_L[d.prof]||'équilibre'}</small></span></button>`).join('')}</div></div></div>
